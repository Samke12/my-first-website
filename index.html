<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Fun Facts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4CAF50, #2196F3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        #fact {
            font-size: 1.2em;
            margin: 20px 0;
            color: #555;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background: #1976D2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 Random Fun Facts</h1>

    <p id="fact">
        Click the button to discover an amazing fact!
    </p>

    <button onclick="showFact()">
        Show Fun Fact
    </button>
</div>

<script>
    const facts = [
        "🐙 Octopuses have three hearts.",
        "🍯 Honey never spoils.",
        "🦒 A giraffe's tongue can be about 50 cm long.",
        "🌍 Earth is the only known planet with life.",
        "🍌 Bananas are technically berries.",
        "🐧 Penguins can jump up to 2 meters out of water.",
        "⚡ Lightning is five times hotter than the sun's surface.",
        "🦋 Butterflies taste with their feet."
    ];

    function showFact() {
        const randomIndex = Math.floor(Math.random() * facts.length);
        document.getElementById("fact").innerText = facts[randomIndex];
    }
</script>

</body>
</html>
